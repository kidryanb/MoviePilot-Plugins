name: Offline plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install 'pydantic>=2.10,<3'
      - run: python tests/v3/downloadcloudupload/test_plugin.py
      - run: python -m compileall -q plugins.v3
      - run: git diff --check
