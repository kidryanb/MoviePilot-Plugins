name: Offline plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install 'pydantic>=2.10,<3'
      - run: python tests/v3/downloadcloudupload/test_plugin.py
      - run: python -m unittest tests/v3/cloudsubscribefork/test_coexist.py tests/v3/cloudsubscribefork/test_drive_routing.py tests/v3/cloudsubscribefork/test_quark_relay.py tests/v3/cloudsubscribefork/test_episode_rules.py tests/v3/cloudsubscribefork/test_cloudflare_seedhub.py tests/v3/cloudsubscribefork/test_search_fixes.py tests/v3/cloudsubscribefork/test_link_and_strm.py tests/v3/cloudsubscribefork/test_quark_features.py
      - run: python -m compileall -q plugins.v3 tools
      - run: git diff --check
